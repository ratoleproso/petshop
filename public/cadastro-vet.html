<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Cadastro de veterinários</title>
    <link rel="stylesheet" href="vet.css">
</head>
<body>
    <form id="cadastro-vet">

    <div class="input-group">
        <label>Nome</label>
        <input type="text" name="nome" id="nome" placeholder="Digite o nome do veterinário">
    </div>

   <div class="input-group">
        <label>CFMV</label>
        <input type="text" name="CFMV" id="cfmv" placeholder="Digite o CFMV do veterinário">
    </div>

    
    <div class="input-group">
        <label>Especialidade</label>
        <input type="text" name="especialidade" id="especialidade" placeholder="Digite o especialidade do veterinário">
    </div>

    <button type="submit" class="btn-submit">Salvar</button>

    </form>
    
      <script src="cadastro-vet.js"></script>
</body>
</html>
